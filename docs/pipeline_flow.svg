<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" font-family="'Noto Sans KR','Pretendard','Malgun Gothic','Apple SD Gothic Neo','WenQuanYi Zen Hei',sans-serif">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap');
    .title{font-size:30px;font-weight:700;fill:#14294A}
    .sub{font-size:15px;fill:#6B7A8C}
    .card{fill:#FFFFFF;stroke:#E1E7EE;stroke-width:1.2}
    .step{font-size:21px;font-weight:700;fill:#14294A}
    .desc{font-size:17px;fill:#4A5868}
    .sep{fill:#B5C0CC}
    .mono{font-family:'JetBrains Mono','Consolas','DejaVu Sans Mono',monospace;font-size:15px;fill:#7A5A1C}
    .num{font-size:15px;font-weight:700;fill:#FFFFFF}
    .phase{font-size:14px;font-weight:700;letter-spacing:1.5px}
    .phaseKo{font-size:13px;fill:#6B7A8C}
    .div{stroke:#E1E7EE;stroke-width:1.2}
    .spine{stroke:#C4CFDB;stroke-width:2}
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#9AA9B9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="sh" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#14294A" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1100" height="740" fill="#F7F9FB"/>

  <!-- 제목 -->
  <text x="40" y="62" class="title">3. 실행 흐름도</text>
  <text x="40" y="90" class="sub">설문 CSV 입력부터 모델 저장까지 6단계 파이프라인</text>

  <!-- 단계 구분 (Phase bands) -->
  <g>
    <rect x="40" y="120" width="104" height="252" rx="12" fill="#1A7F8E" fill-opacity="0.08"/>
    <rect x="40" y="120" width="4" height="252" rx="2" fill="#1A7F8E"/>
    <text x="94" y="242" text-anchor="middle" class="phase" fill="#1A7F8E">DATA</text>
    <text x="94" y="262" text-anchor="middle" class="phaseKo">데이터 준비</text>

    <rect x="40" y="412" width="104" height="162" rx="12" fill="#1F3A5F" fill-opacity="0.08"/>
    <rect x="40" y="412" width="4" height="162" rx="2" fill="#1F3A5F"/>
    <text x="94" y="489" text-anchor="middle" class="phase" fill="#1F3A5F">MODEL</text>
    <text x="94" y="509" text-anchor="middle" class="phaseKo">모델링</text>

    <rect x="40" y="614" width="104" height="72" rx="12" fill="#B7862F" fill-opacity="0.10"/>
    <rect x="40" y="614" width="4" height="72" rx="2" fill="#B7862F"/>
    <text x="94" y="646" text-anchor="middle" class="phase" fill="#B7862F">OUTPUT</text>
    <text x="94" y="666" text-anchor="middle" class="phaseKo">산출물</text>
  </g>

  <!-- 흐름 연결선 -->
  <g class="spine" marker-end="url(#arr)">
    <line x1="190" y1="178" x2="190" y2="222"/>
    <line x1="190" y1="268" x2="190" y2="312"/>
    <line x1="190" y1="358" x2="190" y2="424"/>
    <line x1="190" y1="470" x2="190" y2="514"/>
    <line x1="190" y1="560" x2="190" y2="626"/>
  </g>

  <!-- 단계 카드 -->
  <g id="s1">
    <rect x="230" y="120" width="830" height="72" rx="10" class="card" filter="url(#sh)"/>
    <rect x="230" y="120" width="5" height="72" rx="2.5" fill="#1A7F8E"/>
    <circle cx="190" cy="156" r="20" fill="#1A7F8E"/><text x="190" y="161" text-anchor="middle" class="num">01</text>
    <text x="260" y="163" class="step">데이터 입력</text>
    <line x1="440" y1="138" x2="440" y2="174" class="div"/>
    <text x="466" y="162" class="desc">설문 CSV 파일 불러오기</text>
  </g>
  <g id="s2">
    <rect x="230" y="210" width="830" height="72" rx="10" class="card" filter="url(#sh)"/>
    <rect x="230" y="210" width="5" height="72" rx="2.5" fill="#1A7F8E"/>
    <circle cx="190" cy="246" r="20" fill="#1A7F8E"/><text x="190" y="251" text-anchor="middle" class="num">02</text>
    <text x="260" y="253" class="step">값 검증</text>
    <line x1="440" y1="228" x2="440" y2="264" class="div"/>
    <text x="466" y="252" class="desc">필수 열 확인<tspan class="sep" dx="10">·</tspan><tspan dx="10">결측치 확인</tspan><tspan class="sep" dx="10">·</tspan><tspan dx="10">허용값 범위 확인</tspan></text>
  </g>
  <g id="s3">
    <rect x="230" y="300" width="830" height="72" rx="10" class="card" filter="url(#sh)"/>
    <rect x="230" y="300" width="5" height="72" rx="2.5" fill="#1A7F8E"/>
    <circle cx="190" cy="336" r="20" fill="#1A7F8E"/><text x="190" y="341" text-anchor="middle" class="num">03</text>
    <text x="260" y="343" class="step">전처리</text>
    <line x1="440" y1="318" x2="440" y2="354" class="div"/>
    <text x="466" y="342" class="desc">중복 제거<tspan class="sep" dx="10">·</tspan><tspan dx="10">응답값 숫자 변환</tspan></text>
  </g>
  <g id="s4">
    <rect x="230" y="412" width="830" height="72" rx="10" class="card" filter="url(#sh)"/>
    <rect x="230" y="412" width="5" height="72" rx="2.5" fill="#1F3A5F"/>
    <circle cx="190" cy="448" r="20" fill="#1F3A5F"/><text x="190" y="453" text-anchor="middle" class="num">04</text>
    <text x="260" y="455" class="step">데이터 분할</text>
    <line x1="440" y1="430" x2="440" y2="466" class="div"/>
    <text x="466" y="454" class="desc">정답 비율 유지 (층화 분할)</text>
    <!-- 80/20 분할 바 -->
    <rect x="740" y="438" width="220" height="20" rx="4" fill="#1F3A5F"/>
    <rect x="956" y="438" width="74" height="20" rx="4" fill="#9FB3CC"/>
    <rect x="952" y="438" width="8" height="20" fill="#9FB3CC"/>
    <text x="850" y="453" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">학습 80%</text>
    <text x="993" y="453" text-anchor="middle" font-size="12" font-weight="700" fill="#1F3A5F">평가 20%</text>
  </g>
  <g id="s5">
    <rect x="230" y="502" width="830" height="72" rx="10" class="card" filter="url(#sh)"/>
    <rect x="230" y="502" width="5" height="72" rx="2.5" fill="#1F3A5F"/>
    <circle cx="190" cy="538" r="20" fill="#1F3A5F"/><text x="190" y="543" text-anchor="middle" class="num">05</text>
    <text x="260" y="545" class="step">학습과 평가</text>
    <line x1="440" y1="520" x2="440" y2="556" class="div"/>
    <text x="466" y="544" class="desc">표준화<tspan class="sep" dx="10">→</tspan><tspan dx="10">로지스틱 회귀</tspan><tspan class="sep" dx="10">→</tspan><tspan dx="10">성능 지표 산출</tspan></text>
  </g>
  <g id="s6">
    <rect x="230" y="614" width="830" height="72" rx="10" class="card" filter="url(#sh)"/>
    <rect x="230" y="614" width="5" height="72" rx="2.5" fill="#B7862F"/>
    <circle cx="190" cy="650" r="20" fill="#B7862F"/><text x="190" y="655" text-anchor="middle" class="num">06</text>
    <text x="260" y="657" class="step">결과 저장</text>
    <line x1="440" y1="632" x2="440" y2="668" class="div"/>
    <rect x="466" y="636" width="132" height="28" rx="6" fill="#B7862F" fill-opacity="0.12"/>
    <text x="532" y="655" text-anchor="middle" class="mono">metrics.json</text>
    <rect x="610" y="636" width="132" height="28" rx="6" fill="#B7862F" fill-opacity="0.12"/>
    <text x="676" y="655" text-anchor="middle" class="mono">model.joblib</text>
  </g>
</svg>
